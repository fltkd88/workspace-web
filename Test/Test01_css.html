<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            background:#ddd;
            font-family:"맑은 고딕", sans-serif;
        }
        .container{
            width:500px;
            margin:30px auto;
        }
        h1{
            text-align:center;
            color:#2d4f5a;
            margin-bottom:30px;
        }
        h3{
            color:red;
            margin:15px 0 5px;
        }
        fieldset{
            border:1px solid #999;
            padding:15px;
            margin-bottom:20px;
        }
        table{
            width:100%;
            border-spacing:10px;
        }
        th{
            width:70px;
            text-align:left;
            vertical-align:top;
            font-size:14px;
        }
        input[type=text]{
            width:100%;
            height:25px;
            padding:5px;
        }
        textarea{
            width:100%;
            height:90px;
            resize:none;
            padding:5px;
        }
        .check{
            display:block;
            margin-bottom:10px;
            font-size:14px;
        }
        .btn-box{
            text-align:center;
        }
        button{
            padding:5px 12px;
            margin:0 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>상품 주문서</h1>
        <h3>개인 정보</h3>
        <fieldset>
        <table>
            <tr>
                <th>이름</th>
                <td><input type="text" placeholder="필수"></td>
            </tr>
            <tr>
                <th>연락처</th>
                <td><input type="text" placeholder="필수"></td>
            </tr>
            <tr>
                <th>주소</th>
                <td><input type="text" placeholder="필수"></td>
            </tr>
        </table>
        </fieldset>
        <h3>배송지 정보</h3>
        <label class="check"><input type="checkbox">주문자 정보와 같음</label>
        <fieldset>
            <table>
            <tr>
                <th>이름</th>
                <td><input type="text"></td>
            </tr>
            <tr>
                <th>연락처</th>
                <td><input type="text"></td>
            </tr>
            <tr>
                <th>주소</th>
                <td><input type="text"></td>
            </tr>
            <tr>
                <th>메모</th>
                <td>
                    <textarea placeholder="경비실에 맡겨주세요. 2층에 던져주세요."></textarea>
                </td>
            </tr>
        </table>
        </fieldset>

        <div class="btn-box">
            <button>주문하기</button>
            <button type="reset">다시작성</button>
        </div>
    </div>
</body>
</html>
