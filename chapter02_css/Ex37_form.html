<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 속성 부여 방법 */
        input[type=radio]{
            width: 50px;
        }
        input[type=checkbox]{
            width: 200px;
        }
    </style>
</head>
<body>
    <form action="#">
        <fieldset>
            <input type="radio" name="hobby" value="운동">운동
            <input type="radio" name="hobby" value="영화">영화
        </fieldset>
        <fieldset>
            <input type="checkbox" name="int" value="정치">정치
            <input type="checkbox" name="int" value="문화">문화
            <input type="checkbox" name="int" value="경제">경제
        </fieldset>
    </form>
</body>
</html>
