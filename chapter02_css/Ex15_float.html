<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            너비, 높이 200px
            외곽선 검정 1px 실선
            바깥여백 10px
            글자 가운데 정렬
        */
        div{
            width: 200px;
            height: 200px;
            border: 1px solid black;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body> 
    <div style="float: left; background-color: red;">빨강</div>
    <div style="float: left; background-color: orange;">주황</div>
    <div style="float: left; background-color: yellow;">노랑</div>
    <div style="background-color: green;">초록</div>
    <div style="float: right; background-color: blue;">파랑</div>
    <div style="float: right; background-color: navy;">남색</div>
    <div style="float: right; background-color: purple;">보라</div>
</body>
</html>
