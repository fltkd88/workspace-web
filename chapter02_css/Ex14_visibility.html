<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 300px;
        }
        .invisible-item{
            /* 숨김처리 : hidden, visible */
            visibility: hidden;
            /* visibility 는 숨기면 자리는 차지하고 있다 */
        }
    </style>
</head>
<body>
    <img src="images/fruit1.jpg">&nbsp;
    <img src="images/fruit2.jpg" class="invisible-item">&nbsp;
    <img src="images/fruit3.jpg">&nbsp;
</body>
</html>
