<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            1. E:nth-child(n)       : n번째 요소
            2. E:nth-child(odd)     : 홀수 번째 요소 
            2. E:nth-child(even)    : 짝수 번째 요소 
            2. E:nth-child(an+b)    : b번째부터 a단위 요소 
            2. E:nth-of-type(n)     : E 타입 요소 중 n 번째 
        */
        body p:nth-child(2){
            /* body 아래 두 번째 자식 (div, p, p...)
                두 번째 자식이 p 태그가 아니면 적용 X */
            color: red;
        }
        body p:nth-of-type(2){
            /* body 아래 p 태그 중 두 번째 자식 */
            color: blue;
        }
        body p:nth-of-type(2n+0){
            /* body 아래 p 태그 중 2의 배수 == even */
            font-weight: bold;
        }
        body div:nth-of-type(odd){
            /* body 아래 p 태그 중 홀수 */
            background-color: pink;
        }
    </style>
</head>
<body>
    <div>이것은 div</div>
    <p>이것은 첫 번째 p</p>
    <p>이것은 두 번째 p</p>
    <p>이것은 세 번째 p</p>
    <p>이것은 네 번째 p</p>
    <div>이것은 두 번째 div</div>
    <div>이것은 세 번째 div</div>
    <div>이것은 네 번째 div</div>
</body>
</html>
