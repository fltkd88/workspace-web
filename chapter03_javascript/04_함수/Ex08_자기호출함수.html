<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
</body>
<script>
    /*
        자기 호출 함수
        - 만들면 바로 호출되는 함수 -> 스스로 호출
        - 익명 함수를 ()로 묶는 형태
        - 다른 개발자와 충돌을 방지하기 위함이 목적
    */

    (function(){
        console.log("자기 호출 함수");
    })();


</script>
</html>
