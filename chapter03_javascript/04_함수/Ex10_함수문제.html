        - num 값이 1, 2, 3 이라면
        console.log( makeZeroNum(num, 2) );
         => 01, 02, 03
        console.log( makeZeroNum(num, 3) );
         => 001, 002, 003
        console.log( makeZeroNum(num, 4) );
         => 0001, 0002, 0003

        * 함수 makeZeroNum 을 만드시오
    */

    function makeZeroNum(num, n){
        let zero = String(num);
        
        while(zero.length < n){
            zero = '0' + zero;
        }
        return zero;

    /*
        Q3. 현재 날짜와 시간을 다음과 같은 형식으로
        출력하는 함수 watch를 작성하시오.
        ( 시작 버튼과 중지 버튼 이용 )
        ex ) 2026-08-06 11:03:08 ( 초는 계속 바뀜 )!!
        형식 주의!!
    */
    

    function watch(){
        let date1 = new Date();

        let year = date1.getFullYear();
        let month = String(date1.getMonth() + 1).padStart(2,'0');
        let day = String(date1.getDate()).padStart(2,'0');

        let time = String(date1.getHours()).padStart(2,'0');
        let minute = String(date1.getMinutes()).padStart(2,'0');
        let second = String(date1.getSeconds()).padStart(2,'0');

        const resultDate1 = `${year}-${month}-${day} ${time} : ${minute} : ${second}`;
        const clock1 = document.getElementById("clock");
        clock1.innerText = resultDate1;
    }
    let timer;
    function run(){
        watch();
        timer = setInterval(watch, 1000);
    }

    function stop(){
        clearInterval(timer);
    }

    function reset(){
        stop();
        const clock1 = document.getElementById("clock");
        clock1.innerText = `0000-00-00 00:00:00`;
    }
</script>
