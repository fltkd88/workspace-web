<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    /*
        프로토타입(prototype)
        - 생성자 함수는 프로토타입 프로퍼티를 가지고 있다.
        -생성자로부터 생성된 인스턴스(객체)는
        프로토타입으로부터 프로퍼티와 메소드를 상속 받는다.
        - 생성자 함수와 프로토타입은 서로 참조할 수 있다.

        즉 생성자 함수가 만들어질 때 프로토타입도 생성된다.
    */

    // 1. 일반 생성자
    // 생성자 함수 생성
    function Person(name, age){
        this.name = name;
        this.age = age;
        this.eyes = 2;
        this.nose = 1;
    }
    // 객체 생성
    let p1 = new Person('김씨', 20);
    let p2 = new Person('박씨', 25);
    console.log(p1);
    console.log(p2);
    console.log(p1.eyes);
    console.log(p2.eyes);
    
    // 생성자 함수 생성
    function Person2(name, age){
        this.name = name;
        this.age = age;
        this.__proto__.eyes = 2;
        this.__proto__.nose = 1;
    }
    const man = new Person2("김씨", 20);
    const woman = new Person2("박씨", 30);
    console.log(man);
    console.log(woman);
    console.log(man.eyes);
    console.log(man.nose);
    
    // 생성자 함수 생성
    function Person3(name, age){
        this.name = name;
        this.age = age;
    }
    // !! 생성자 밖에서 프로토타입 추가
    Person3.prototype.eyes = 2;
    Person3.prototype.nose = 1;

    const man3 = new Person3("김씨", 20);
    const woman3 = new Person3("박씨", 30);
    console.log(man3);
    console.log(woman3);
    console.log(man3.eyes);
    console.log(man3.nose);

    /*
        Q. 생성자 함수를 이용하여 학생 객체를 생성하고,
        학생의 이름과 평균 출력
        1. 생성자 : Student(name, kor, eng, mat)
        2. 평균 반환 메소드 : getAverage
        3. 내용을 출력하는 메소드 : info
        4. 두 명 이상의 학생 객체를 생성
        5. 학생들을 담는 배열 students를 생성 후 학생 객체를 추가
        6. 반복문을 이용하여 정보 출력
    */
    function Student(name, kor, eng, mat){
        this.name = name;
        this.kor = kor;
        this.eng = eng;
        this.mat = mat;
    };
    Student.prototype.getAverage = function(){
        return(this.kor + this.eng + this.mat) / 3;
    };

    Student.prototype.info = function(){
        console.log(`${this.name}의 국어 점수: ${this.kor} / 영어 점수: ${this.eng} / 수학 점수: ${this.mat}
        평균은 : ${this.getAverage()}`);
    }

    const stu1 = new Student('김씨', 85, 78, 91);
    const stu2 = new Student('이씨', 78, 95, 88);

    const students =[];
    students.push(stu1);
    students.push(stu2);

    for(let stu of students){
        stu.info();
    }
    
</script>
</html>
