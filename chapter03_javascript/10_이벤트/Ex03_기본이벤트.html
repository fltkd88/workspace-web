<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" id="form">
        <input type="text">
        <input type="submit">
    </form>
    <br>
    <a href="http://www.google.com" id="a">이동</a>
</body>
<script>
    /*
        이벤트를 직접 부여하지 않아도 기본적으로 실행되는 이벤트
        1. <a> 태그의 속성 href 속성
        2. <input type="submit"> 등

        기본적으로 부여되는 이벤트를 무시하고 추가적인 작업을 
        해야하는 경우에 event.prevenDefault()로 무시할 수 있다.
    */
    const form = document.querySelector('#form');
    const a = document.querySelector('#a');

    a.addEventListener('click', function(e){
        e.preventDefault();
        console.log('a 기본 기능 방지');
    });
    form.addEventListener('click', function(e){
        e.preventDefault();
        console.log('form 기본 기능 방지');
    });
</script>
</html>
