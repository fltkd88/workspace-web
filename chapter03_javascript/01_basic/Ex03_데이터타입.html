<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
</body>
<script>
    /*
        기본 자료형
        1. 숫자         number
        2. 문자열       string
        3. 논리형       boolean
        4. 널           null
        5. 언디파인드   undefined(아직 값이 정해지지 않음)

        * 데이터 타입 확인 방법
        1. typeof 데이터
        1. typeof(데이터) 
    */
    
    // 1. 숫자(number)
    // 정수 및 실수 데이터
    let numVal1 = 1;
    let numVal2 = 3.14;
    console.log(typeof numVal1);
    console.log(typeof numVal2);
    console.log(numVal1);
    console.log(numVal2);
    
    // 2. 문자열(string)
    // 텍스트 값을 다룰 때에 사용
    // 작은 따옴표('') 혹은 큰 따옴표("")로 값을 감싼다.
    // `` 로도 사용 가능 (뒤에서 추가 설명 예정)
    let strVal1 = "hello";
    strVal1 += ' js';  
    strVal1 = `sssss`;
    console.log(typeof strVal1);
    console.log(strVal1);
    // 작은 따옴표를 쓰는 것이 오류가 덜 생기는 편

    let age = 20;
    let msg1 = "내 나이는 " + age + "살 입니다.";
    let msg2 = '내 나이는 ' + age + '살 입니다.';
    let msg3 = `내 나이는 ${age}살 입니다.`;

    // 논리형(boolean)
    // 참 / 거짓 두 가지의 값 만을 나타낼 떄 사용
    let boolVal1 = true;
    let boolVal2 = false;
    console.log(typeof boolVal1);
    console.log(boolVal1);

    // 4. null
    // 값이 존재하지 않는다고 판달할 때 사용
    let nullVal1 = null;
    console.log(nullVal1);
    
    // 5. undefined
    // 값이 설정되지 않음을 의미
    let unVal1;
    console.log(unVal1);

    //-------------------------------------

    // 형 변환
    /*
        문자 -> 숫자
        1. Number(값)
        - 해당 값의 실수 부분까지 모두 변환
        - 값을 변환하지 못하면 NaN 반환
        2. parseInt(값)
        - 해당 값을 변환 후 정수 부분만 반환
        - 특정 값에서 정수 부분만을 반환
        3. parseFloat(값)
        - 해당 값을 변환 후 실수 부분만 반환
        - 특정 값에서 실수 부분만을 반환
    */
    let val = '3.14 == 원주율';
    console.log(Number(val));
    console.log(parseInt(val));
    console.log(parseFloat(val));

    val = '원주율 == 3.14';
    console.log(Number(val));
    console.log(parseInt(val));
    console.log(parseFloat(val));
    
    /*
        숫자 -> 문자
        1. string(값)
        - 해당 값을 모두 다 문자열로 변환
        2. 문자열 + 값
        - 변환할 값 앞에 문자열 데이터와 '+' 연산자 사용
    */
    let a = 3.14;
    let b = true;
    let c = null;

    console.log(a);
    console.log(b);
    console.log(c);
    
    console.log('' + a);
    console.log('' + b);
    console.log('' + c);
    
    console.log(String(a));
    console.log(String(b));
    console.log(String(c));
</script>
</html>
