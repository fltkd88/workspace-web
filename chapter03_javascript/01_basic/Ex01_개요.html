<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style></style>
</head>
<body>
</body>
<script>
    // 자바스크립트 주석
    // 1. 한 줄 주석    : //
    // 2. 여러 줄 주석  : /* */

    /*
        HTML 파일에서 자바스크립트 사용하는 방법
        1. script 태그 안에서 코드 작성
            1) head 태그 안에서 script 태그 작성
            2) body 태그 안에서 script 태그 작성
        2. 자바스크립트 파일(.js) 링크
    */
    
    // 출력1. 경고창
    window/alert("Hello");
    alert("Javascript"); // window 생략 가능

    // 출력2. 콘솔창
    console.log("Hello JS");

    // 출력3. 브라우저 화면
    document.write("<h1>");
    document.write("Hello ES");
    document.write("</h1>");

</script>
</html>
