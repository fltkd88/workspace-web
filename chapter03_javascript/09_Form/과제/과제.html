<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        .container{
            width: 700px;
            margin: auto;
        }
        
        .val1{
            text-align: center;
        }
        #sub, #re{
            background-color: rgb(18, 151, 151);
            color: white;
            width: 100px;
            height: 50px;
        }
        #textbox{
            width: 370px;
            height: 150px;
            resize:none;
        }
        td{
            padding: 3px;
            border: 1px solid black;
            
        }
        th{
            padding: 0px;
            border: 1px solid black;
            background-color: rgb(18, 151, 151);
            color: white;
            height: 30px;
        }
        table{
            width: 100%;
            border-collapse: collapse;
        }
        #uId,#uPw,#email,#uName{
            width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="val1">회원가입</h1>
        <form action="#" name="myHG">
            <table>
                <tr>
                    <th colspan="2">회원기본정보</th>
                </tr>
                <tr>
                    <td><label for="uId">아이디</label></td>
                    <td><input type="text" name="id" id="uId" placeholder="※8~16자 소문자+숫자"></td>
                </tr>
                <tr>
                    <td><label for="uPw">비밀번호</label></td>
                    <td><input type="password" name="pw" id="uPw" placeholder="※8~16자 대문자+소문자+숫자"></td>
                </tr>
                <tr>
                    <td><label for="uPw">비밀번호 확인</label></td>
                    <td><input type="password" name="checkpw" id="uPw"></td>
                </tr>
                <tr>
					<td><label for="emails" >이메일</label></td>
                    <td><input type="text" name="email1" id="emails"/>&nbsp;
                    @&nbsp; <input type="text" name="email2" id="emails" list="domain" placeholder="직접 입력" />
						<datalist id="domain">
							<option value ="naver.com">naver.com</option>
							<option value ="daum.net">daum.net</option>
							<option value ="gmail.com">gmail.com</option>
						</datalist>
                    </td>
                </tr> 
                <tr>
                    <td><label for="uName">이름</label></td>
                    <td><input type="text" name="name" id="uName"></td>
                </tr>
                <tr>
                    <th colspan="2">개인정보</th>
                </tr>
                <tr>
					<td><label for="num" >주민등록번호</label></td>
                    <td><input type="text" name="sn1" size="12"/>&nbsp;
                    - &nbsp;<input type="text" name="sn2" id="num" size="12"/> 예) 123456-1234567 <button type="button" onclick="day1()">확인</button>
                    </td>
                    
                </tr>
                <tr>
                    <td><label for="birth">생일</label></td>
                    <td>
                        <input type="text" readonly id="year" size="8" style="background-color: rgb(221, 211, 211);">년
                        <input type="text" readonly id="month" size="8" style="background-color:  rgb(221, 211, 211);">월
                        <input type="text" readonly id="day" size="8" style="background-color:  rgb(221, 211, 211);">일
                    </td>
                </tr>
                <tr>
                    <td>성별</td>
                    <td>
						<input type="radio" id ="man" name="gender" value="남" /><label for="man">남자</label>&nbsp;
						<input type="radio" id ="woman" name="gender" value="여" /><label for="woman">여자</label>
					</td>
                </tr>
                <tr>
                    <td>관심분야</td>
                    <td>
                        <input type="checkbox" id="travel" name="interest" value="여행"><label for="travel">여행</label>&nbsp;
                        <input type="checkbox" id="movie" name="interest" value="영화"><label for="movie">영화</label>&nbsp;
                        <input type="checkbox" id="reading" name="interest" value="독서"><label for="reading">독서</label>&nbsp;
                        <input type="checkbox" id="music" name="interest" value="음악"><label for="music">음악</label>&nbsp;
                        <input type="checkbox" id="none" name="interest" value="관심없음"><label for="none">관심없음</label>
                    </td>
                </tr>
                <tr>
                    <td>자기소개</td>
                    <td style="padding-top: 20px; padding-bottom: 20px;">
                        <textarea name="self" id="textbox"></textarea>
                    </td>
                </tr>
            </table>
            <div class="val1">
				<br />
				<input type="submit" id="sub" value="회원가입" onclick="join()"/>
				<input type="reset" id="re" value="다시입력"/>
			</div>
        </form>
    </div>
</body>
<script>
    const regId = /^[0-9a-z]{8,16}$/;
    const regPw = /^[0-9a-zA-Z]{8,16}$/;
    const regName = /^[가-힣]{2,6}$/;
    const regEmail = /^[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*@[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*\.[a-zA-Z]{2,3}$/i;
    const regPid1 = /^\d{6}$/;
    const regPid2 = /^\d{7}$/;

    const hg = document.forms.myHG;
    const {id,pw,checkpw,email1,email2,name,sn1,sn2,gender,interest,self} = hg;

    function join(){
        if(!regId.test(id.value)){
            alert(`아이디는 8~16자리 혹은 숫자와 소문자만 입력 가능합니다.`);
            id.focus();
            return;
        }
        if(!regPw.test(pw.value)){
            alert(`비밀번호는 8~16자리 혹은 숫자와 소문자 및 대문자만 입력 가능합니다.`);
            pw.focus();
            return;
        }
        if(pw.value != checkpw.value){
            alert(`비밀번호와 일치 하지 않습니다.`);
            checkpw.focus();
            return;
        }
        if(!regName.test(name.value)){
            alert(`이름은 2~6자리만 입력 가능합니다.`);
            name.focus();
            return;
        }
        const email = email1.value+'@'+email2.value;
        if(!regEmail.test(email)){
            alert(`이메일을 올바르게 입력하세요.`);
            email1.focus();
            return;
        }
        if(!regPid1.test(sn1.value)){
            alert(`숫자 6자리 입력하세요.`);
            sn1.focus();
            return;
        }
        if(!regPid2.test(sn2.value)){
            alert(`숫자 7자리 입력하세요.`);
            sn2.focus();
            return;
        }
        for(let i=0; i<interest.length; i++){
            if(interest[i].checked == true){
                return;
            } else{
                alert(`최소 1개 이상 선택`);
                interest.focus();
                return;
            }
        }
        for(let i=0; i<gender.length; i++){
            if(gender[i].checked == true){
                return;
            } else{
                alert(`최소 1개 이상 선택`);
                gender.focus();
                return;
            }
        }
        if(self.value == ""){
            alert(`자기소개 필수로 적어야 함`);
            self.focus();
            return;
        }
    };
    function day1() {
        const year = document.querySelector('#year');
        const month = document.querySelector('#month');
        const day = document.querySelector('#day');
        if(sn2.value.charAt(0) == 1 || sn2.value.charAt(0) == 2) {
            year.value = 19 + sn1.value.substr(0,2);
            console.log(year.value);
            
        } else if(sn2.value.charAt(0) == 3 || sn2.value.charAt(0) == 4) {
            year.value = 20 + sn1.value.substr(0,2);
            console.log(year.value);
        }
        month.value = sn1.value.substr(2, 2);
        day.value = sn1.value.substr(4);
    }

</script>
</html>
