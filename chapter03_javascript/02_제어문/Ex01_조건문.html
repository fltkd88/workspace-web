<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    // 1. if 문
    // if 괄호 안에 있는 조건식이 참이면
    // 중괄호 안에 내용을 수행
    // 거짓이면 아무것도 수행하지 않는다.
    let val = 10;
    if (val < 11) {
        console.log(`val이 11보다 작습니다.`);
    }

    val = 1;
    if (val < 11) {
        let val = 2;
        console.log(`if 내부의 값은${val}`);
    }
    console.log(`if 외부의 값은${val}`);
    
    // 2. if-else 문
    // if면 ~ 하고, 그렇지 않으면 (나머지) else
    val = 10;
    if (val > 11) {
        console.log(`val이 11보다 큽니다.`);
    } else {
        console.log(`val이 11보다 작습니다.`);
    }

    // 3. if-else if-else
    // 조건이 여러개 일 때 사용
    if (val > 0) {
        console.log(`양수`);
    } else if (val < 0) {
        console.log(`음수`);
    } else{
        console.log(`0`);
    }

    // switch 문
    // - if 문과 비슷하게 조건을 통해서 원하는 결과문
    // 도출하는 조건문
    // if 문은 괄호 안에 조건식이 들어가고,
    // switch 문은 값을 사용한다.
    const gender = '남';
    switch (gender) {
        case '남': console.log(`성별이 남자입니다.`);
            break;
        case '여': console.log(`성별이 여자입니다.`);
            break;
        default: console.log(`또 다른 성별입니다.`);
            break;
    }
    /*
        Q. 국어, 영어, 수학 점수를 입력받아
        평균과 학점 출력(콘솔)
        - 변수명 : kor, emg, mat, avg, grade
        - 학점 : A~F
    */
    let kor = Number(prompt(`국어 점수를 입력하시오.`));
    let emg = Number(prompt(`영어 점수를 입력하시오.`));
    let mat = Number(prompt(`수학 점수를 입력하시오.`));
    
    let avg = (kor+emg+mat) / 3;

    if (avg >= 90) console.log(`평균 : ${avg}, A학점 입니다.`);
    else if (avg >= 80) console.log(`평균 : ${avg}, B학점 입니다.`);
    else if (avg >= 70) console.log(`평균 : ${avg}, C학점 입니다.`);
    else if (avg >= 60) console.log(`평균 : ${avg}, D학점 입니다.`);
    else console.log(`평균 : ${avg}, F학점 입니다.`);
        
</script>
</html>
