<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="list"></ul>
</body>
<script>
    const fruits = ['apple','banana','orange','kiwi','grape'];

    // 위 배열을 이용하여 리스트를 작성하여
    // ul 태그 내에 데이터를 주입하시오.

    for(let f of fruits){
        let liEle = document.createElement('li');
        // <li></li>
        let fName = document.createTextNode(f);
        // 'apple'
        liEle.appendChild(fName);
        // <li>apple</li>
        let list = document.querySelector("#list");
        list.appendChild(liEle);
    }

    let msg = '';
    for(let f of fruits){
        msg += `<li>${f}</li>`;
    }
    document.querySelector("#list").innerHTML = msg;
    
</script>
</html>
