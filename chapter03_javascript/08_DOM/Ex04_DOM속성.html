<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id="img1">
    <br>
</body>
<script>
    /*
        요소에 속성 추가 방법
        1. 프로퍼티에 값을 추가
            요소.프로퍼티 = 값
        2. 함수
            요소.setAttribute('속성이름', '값')
    */
    // 1. 이미 있는 요소에 속성 추가(변경)
    document.getElementById("img1").setAttribute('src','../images/bart.jpg');
    // 또 다른 방법
    document.getElementById("img1").src = '../images/bart.jpg';

    // 요소 저장 후 하는 방법
    let imgEle = document.getElementById("img1");
    imgEle.setAttribute('src','../images/bart.jpg');
    imgEle.src = '../images/bart.jpg';

    // 2. 새 요소 만들어서 추가(img)
    let img = document.createElement('img');
    img.src = '../images/bart.jpg';
    img.alt = '구글 사진';
    img.width = 200;
    document.body.appendChild(img);

    // 3. 문자열로 새 요소 만들어서 추가
    let tmp = `<img src="../images/google.jpg">`;
    document.body.innerHTML += tmp;

</script>
</html>
