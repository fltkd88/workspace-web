<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</body>
<script>
    // 특정 값이 여러 값 중 하나인지 확인 할 때
    function isAnimals(text){
        const animals = ['고양이', '개', '거북이'];
        return animals.includes(text); 
    }
    isAnimals('개');

    // 값에 따라 다른 결과물을 반환해야 할 떄
    function getSound(animal){
        if(animal === '개')return '멍멍!';
        if(animal === '고양이')return '야옹~';
        if(animal === '참새')return '짹짹';
        if(animal === '비둘기')return '구구';
        return '...?';
    }
    console.log(getSound('개'));
    console.log(getSound('비둘기'));
    
    // 객체를 이용하여 편리하게 사용 가능
    function getSound2(animal){
        const sounds = {
            개 : '멍멍!',
            고양이 : '야옹~',
            참새 : '짹짹',
            비둘기 : '구구'
        };
        return sounds[animal] || '...?';
    }
    console.log(getSound2('개'));
    console.log(getSound2('비둘기'));

    /*
        삼항연산자
        - 조건 ? 참일때 : 거짓일때
        - if(){
          }else{
          }

        * 조건 중 참일 때에만 실행되는 연산자
        - 조건 && 실행 내용  // if 개념

        * 조건 중 앞의 값이 거짓이면 뒤의 값 사용
        - 값 || 기본값  // else 개념
    */

</script>
</html>
