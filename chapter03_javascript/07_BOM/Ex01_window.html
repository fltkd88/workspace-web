<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    /*
        BOM( Browser Object Model )
        - 자바스크립트에서 브라우저의 기능들을
        제어 관리할 때 사용하기 위한 객체
        - window, histroy, location, document
    */

    /*
        1. window 객체
        - 브라우저 내장 객체 중에서 최상위 객체
        - 모든 전역 객체, 함수, 변수 등은 자동적으로
        window 객체에 속함
        - window.함수(), window.프로퍼티 등과
        같은 형태로 사용 가능
        - window 객체를 생략한 형태로 사용 가능
            ex) window.alert() -> alert()

        2. window 객체 생성
        - open("url", "name", "feature");
            1) url : 주소, 파일의 경로
            2) name : <a> 태그의 target
            3) feature : 크기, 위치 등 옵션 정보
            
        3. window 객체 소멸
        - close();
    */

    // 1. window 프로퍼티 확인
    for(let p in window){
        console.log(`${p} : ${window[p]}`);
        
    }
    
    // 2. 생 창 만들기
    let newWin = window.open('', '', 'width=400, height=300');
    // 너비와 높이는 단위를 붙이지 않는다.

    if(newWin){
        newWin.document.write(`<h>팝업</h>`);
    }else{
        alert(`팝업 차단을 해제하세요`);
    }

    
</script>
</html>
