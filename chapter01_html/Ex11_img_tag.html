<!-- 
    <img> 태그
    1. 이미지를 삽입한다.
    2. 속성
        1) src : 이미지의 경로 및 이름
        2) alt : 이미지 대신 표시할 텍스트
    3. 경로 표시
        1) 절대 경로 : C:/dev/workspace...images/google.jpg
        2) 상대 경로 : images/google.jpg
            ( / 로 시작하면 컨텍스트 루트부터 시작 )
        3) 주요 폴더
            (1) .  : 현재 폴더
            (2) .. : 상위 폴더 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>이미지 표시</h1>
    <img src="images/google.jpg" alt="구글 이미지!!">
    <!-- alt 속성은 이미지를 제대로 로드하지 못한 경우 alt 값을 출력 -->

    <h1>서버에 저장된 이미지</h1>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzXBiJbmYo2uvVJweIo2klkAJ7m2s_xL5qNZTzIheiMg&s=10">
    <!-- 이미지 주소 복사 -->

    <h1>크기를 조정한 이미지</h1>
    <img src="images/google.jpg" width="300">
    <!-- 너비(width) 나 높이(height) 중 하나만 조정해도 함께 비율적으로 조정된다. -->
</body>
</html>
