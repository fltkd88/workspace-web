<!-- 
    * HTML Semantic 문서 구조
    <header>
    - 웹 페이지나 섹션의 머리글을 정의
    주로 제목, 로고, 네비게이션 링크 등 포함
    
    <nav>
    - 네비게이션 링크 정의
    - 페이지 내의 다른 섹션이나 외부 웹 사이트로 링크

    <section>
    - 웹 페이지의 독립적인 구역을 정의
    보통 제목관 관련 콘텐츠를 포함

    <aside>
    - 문서의 주된 내용과는 조금 거리가 있는 내용. 광고

    <footer>
    - 웹 페이지나 섹션의 바닥글을 정의
    주로 저작권 정보, 연락처, 사이트 맵 등 포함
-->
