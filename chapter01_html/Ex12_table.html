<!--
	테이블(표) 태그

	1. 표를 만들 때 사용한다.
	2. <table></table> 태그를 사용한다.
	3. 행을 만들 때 <tr></tr> 태그를 사용한다.
	4. 열을 만들 때 <td></td> 태그를 사용한다. 
	5. 제목 열을 만들 때 <th></th> 태그를 사용한다.
	6. 행 병합은 rowspan 속성을 이용한다.	(rowspan ="2" ("합칠칸수")
	7. 열 병합은 colspan 속성을 이용한다.	
	
	* cellpadding : 셀 내부 간격
	* cellspacing : 셀과 셀간격	
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>3행 2열 테이블</h1>
    <table border="1">
        <tr>
            <th>이름</th>  
            <th>나이</th>
        </tr>
        <tr>
            <td>김씨</td>
            <td>10</td>
        </tr>
        <tr>
            <td>박씨</td>
            <td>20</td>
        </tr>
    </table>
    <!-- 
        <table> 태그 레이아웃

            1. <thead></thead>
            2. <tbody></tbody>
            3. <tfoot></tfoot>
            4. 작성 순서에 상관 없이 위 1~3 순서로 처리
    -->
    <h1>3행 2열 테이블</h1>
    <table border="1">
        <thead>
            <tr>
                <th>이름</th>  
                <th>나이</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>김씨</td>
                <td>10</td>
            </tr>
            <tr>
                <td>박씨</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
