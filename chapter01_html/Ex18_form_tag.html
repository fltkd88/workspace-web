<!-- 반드시 알아야 함 ★★★★★★
    <form> 태그
    1. 사용자로부터 정보를 입력받을 때 사용
    2. 주요 속성
        1) action : 정보를 받아서 어디서 처리할 것인지
                    처리할 장소를 지정
        2) method : 정보를 전달하는 방식
            (1) get : default, 정보를 header에 포함 빠르지만   무조건 알아야함★★★
                      정보가 노출(검색)
            (2) post : 정보를 body에 포함 느리지만             무조건 알아야함★★★
                       보안처리(로그인, 회원가입)
        3) enctype : 파일 업로드 할 때 사용 (무조건 post 방법으로 업로드 해야함)
    
    input 은 값이 value로 이동한다.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" method="get">
        <!-- 1. 텍스트 상자 -->
        <h3>텍스트 상자</h3>
        일반 텍스트 상자 : <input type="text" placeholder="일반 텍스트 상자"> <br>
        비밀번호 : <input type="password" placeholder="비밀번호"> <br>
        숫자 : <input type="number"> <br>
        이메일 : <input type="email"> <br>
        URL : <input type="url"> <br>
        전화번호 : <input type="tel"> <br>
        날짜 : <input type="date"> <br>
        시간 : <input type="time"> <br>

        <hr>

        <!-- 1. label이 없는 경우 -->
        아이디 <input type="text"> <br>
        <!-- 2-1 label이 있는 경우 -->
        <label>아이디 <input type="text"></label> <br>
        <!-- 2-2 label이 있는 경우 -->
        <label for="uId">아이디</label> <input type="text" id="uId">

        <hr>

        <!-- 2. 버튼 -->
        <h3>버튼</h3>
        일반 버튼 : <input type="button" value="전송"> <br>
        일반 버튼 : <button>전송</button> <br> 
        <!-- button은 form문 안에 있으면 submit과 같은 역할을 해서 그냥 버튼으로 쓰고 싶다면
             <button type="button"> 이렇게 타입을 줘야한다.  -->
        전송 버튼 : <input type="submit" value="전송"> <br>
        <!-- submit : 폼에 입력된 모든 데이터를 action 으로 전송 -->
        초기화 : <input type="reset" value="초기화"> <br>
        이미지 : <input type="image" src="images/bart.jpg" width="200"> <br>
        숨김 : <input type="hidden" name="age" value="20">
        <!-- age 변수에 20 저장 -->

        <hr>
        
        <!-- 3. 라디오 버튼 -->
        <!-- 여러 선택 중에서 하나만 선택하는 경우 -->
        <!-- name 속성을 같은 값으로 설정 -->
        <h3>라디오 버튼</h3>
        <input type="radio" name="gender" id="M" checked>남
        <input type="radio" name="gender" id="F">여
        <br>
        <!-- checked="checked" 옵션으로 초기 값 설정 가능 -->
        
        <hr>

        <!-- 4. 체크 박스 -->
        <!-- 여러 선택 중 자유롭게 선택하는 경우 -->
        <!-- name 속성을 같은 값으로 설정 -->
        <h3>체크박스</h3>
        <input type="checkbox" name="hobbies" value="영화"> 영화
        <input type="checkbox" name="hobbies" value="음악"> 음악
        <input type="checkbox" name="hobbies" value="독서"> 독서
        <br>

        <hr>

        <!-- 5. 필드 셋 -->
        <h3>필드셋</h3>
        <fieldset>
            <legend>지역</legend>
            <input type="checkbox" name="region" value="강남">강남
            <input type="checkbox" name="region" value="강동">강동
            <input type="checkbox" name="region" value="강북">강북
            <input type="checkbox" name="region" value="강서">강서
        </fieldset>

        <hr>

        <!-- 6. textarea -->
        <!-- 많은 양의 텍스트를 처리할 때 -->
        <!-- 행 : rows, 열 : cols -->
        <h3>textarea</h3>
        <textarea rows="10" cols="100" placeholder="자기소개" style="resize: none;"></textarea>
        <!-- style="resize: none 크기를 바꿀 수 없게 하기 위해 사용 -->

        <hr>

        <!-- 7. 목록 상자(선택만 가능) -->
        <!-- <select> 태그로 목록을 만들고, <option> 테그로 값을 추가 -->
        <h3>목록 상자</h3>
        <select name="addr1">
            <option value="s">서울</option>
            <option value="g">경기</option>
            <option value="i">인천</option>
        </select>
        <br>
        <select name="addr2" size="4" multiple>
            <option value="강남">강남</option>
            <option value="강동">강동</option>
            <option value="강북">강북</option>
            <option value="강서">강서</option>
        </select>
        <!-- multiple은 다중 선택이 가능하게 한다. -->

        <hr>

        <!-- 8. 콤보 상자(목록상자 + 직접입력) -->
        <h3>콤보 상자</h3>
        <input type="text" list="animals">
        <datalist id="animals">
            <option value="강아지">강아지</option>
            <option value="고양이">고양이</option>
            <option value="앵무새">앵무새</option>
            <option value="고슴도치">고슴도치</option>
        </datalist>

        <hr>

        <!-- 9. 기타 -->

        <!-- 진행 바 : 전체 100중 50 진행 상태 -->
        50% 진행 <progress value="50" max="100"></progress>
        <br>

        <!-- 색상표 -->
        색상표 : <input type="color"> <br>

        <!-- 범위 바 : 0~100 사이 10 단위로 표시 -->
        범위 : <input type="range" min="0" max="100" step="10"> 
        <br>

        <!-- 파일 첨부 -->
        첨부 파일 : <input type="file">
        
    </form>
</body>
</html>
