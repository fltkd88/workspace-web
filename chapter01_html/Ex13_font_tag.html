<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dongle&display=swap" rel="stylesheet">
</head>
<body style="background-color: cadetblue">
   <h1>글꼴 크기</h1>
    <font size ="1">글꼴크기 1</font>
    <font size ="2">글꼴크기 2</font>
    <font size ="3">글꼴크기 3</font>    <!-- 기본 크기는 3 -->
    <font size ="4">글꼴크기 4</font>
    <span style="font-size: 5vmin">글꼴크기 5</span>	<!-- 동적 크기 변경 -->
    <font size ="6">글꼴크기 6</font>
    <font size ="7">글꼴크기 7</font>
    <font size ="8">글꼴크기 8</font>    <!-- 글꼴 크기는 7까지만 가능 -->
    
    <font size = "-1">글꼴크기2</font>   <!-- 기본크기 -1 -->
    <font size = "+1">글꼴크기4</font>   <!-- 기본크기 +1 -->
   
    <hr />
    
    <h1>글꼴 색상</h1> 
    <!-- #RGB :R(00~FF), G(00~FF), B(00~FF) -->
    <font color = "#000000">이 문장은 검정색 입니다.</font><br />
    <font color = "#FFFFFF">이 문장은 하얀색 입니다.</font><br />
    <font color = "#FF0000">이 문장은 빨간색 입니다.</font><br />
    <span style="color: yellow">이 문장은 노란색 입니다.</span><br />
    
    <hr />
    
    <h1>글꼴 변경</h1>
    
    <!-- 윈도우 기본 글꼴 위치 : C:/Windows/Fonts -> 각 글꼴 우클릭 -> 속성 -> 자세히 -> 제목에 적힌 값 사용  -->
    <font face ="맑은 고딕">맑은 고딕</font> <br />
    <font face ="궁서">가나다라마바사ABCDEabcde12345</font> <br />    <!-- 고정길이폰트 : Monospaced font-->
    <font face ="궁서체">가나다라마바사ABCDEabcde12345</font> <br />
    <span style="font-family: 궁서체">가나다라마바사ABCDEabcde12345</span><br />
    <font face ="나눔고딕코딩, 나눔고딕">플랜A는 나눔고딕코딩, 플랜B는 나눔고딕</font> <br />

    <!-- 
        구글 폰트 
        1. 구글폰트 사이트에서 원하는 폰트를 찾는다.
        2. link 태그를 복사하여 head 태그 내에 추가한다.
        3. 사용할 태그에 스타일을 부여한다.
    -->
    <span style="font-family: Dongle, sans-serif;">안녕하세요.</span>
 </body>
</html>
