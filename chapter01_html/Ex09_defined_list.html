<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <dl>
        <dt><b>키보드</b></dt>
        <dd>키보드는 표준 입력 장치</dd>
        <dt><strong>마우스</strong></dt>  <!-- strong은 중요하다 생각하는 요소에 쓴다. -->
        <dd>마우스는 GUI환경 입력 장치</dd>
    </dl>
</body>
</html>
